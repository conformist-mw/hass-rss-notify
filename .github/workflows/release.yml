name: Release

# HACS installs the tagged repository content directly, so no ZIP asset is built
# or attached (`zip_release` is deliberately not used in hacs.json).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Verify the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version custom_components/rss_notify/manifest.json)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match manifest version ${manifest}"
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
