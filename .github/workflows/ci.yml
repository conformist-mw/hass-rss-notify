name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # homeassistant 2026.7.4 / pytest-homeassistant-custom-component require >= 3.14.2
  PYTHON_VERSION: "3.14"

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        # the 100% statement+branch invariant is enforced here, not just claimed
        run: >-
          pytest -q --cov=custom_components/rss_notify --cov-branch
          --cov-fail-under=100

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration
          # This check asks brands.home-assistant.io whether the domain is
          # registered, and it never will be: home-assistant/brands stopped
          # accepting icons for custom integrations, which now ship their own
          # under `custom_components/rss_notify/brand/`. The ignore is permanent.
          ignore: brands
